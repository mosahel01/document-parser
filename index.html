<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert, rename, merge, and compress documents without uploading them."
    />
    <title>Document Toolkit</title>
    <script>
      // Set the theme before the first paint, or a dark-mode visitor gets a
      // flash of cream while React boots.
      (() => {
        try {
          const stored = localStorage.getItem('document-toolkit-theme');
          const dark =
            stored === 'dark' ||
            (stored === null &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch {
          // A blocked localStorage only costs the saved choice, not the page.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
