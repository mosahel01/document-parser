<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0051f2" />
    <meta
      name="description"
      content="Merge, split, compress, convert, and edit PDFs in your browser. MergePDF keeps your files on your device."
    />
    <link rel="canonical" href="https://mergepdf.com/" />
    <meta property="og:site_name" content="MergePDF" />
    <meta property="og:title" content="MergePDF — Online PDF tools for everyone" />
    <meta
      property="og:description"
      content="Every PDF tool you need, running entirely in your browser."
    />
    <title>MergePDF — Online PDF tools for everyone</title>
    <script>
      // Set the theme before the first paint, or a dark-mode visitor gets a
      // flash of cream while React boots.
      (() => {
        try {
          const stored = localStorage.getItem('mergepdf-theme');
          const dark =
            stored === 'dark' ||
            (stored === null &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch {
          // A blocked localStorage only costs the saved choice, not the page.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
